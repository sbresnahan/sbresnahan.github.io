# Site settings
title: "Sean T. Bresnahan"
url: "https://seantbresnahan.com"
baseurl: "" # root custom domain (no project subpath)
description: "Computational genetics of parental genomes, prenatal environments, and gene regulation."
social_image:
  path: /assets/images/social_preview.png
  width: 1280
  height: 640
  alt: "Research overview connecting evolutionary origins, placental functional genomics, and environmental modification of genetic risk."

# Build settings
markdown: kramdown
plugins:
  - jekyll-email-protect

# Google Analytics (ported from previous site)
google_analytics: "G-Q3F3WR2V68"

collections:
  - publications
  - news
  - showcase
  - posts

# Keep build products, local dependencies, and repository documentation off the site.
exclude:
  - _site
  - .bundle
  - .github
  - .gitignore
  - .ruby-version
  - .DS_Store
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
