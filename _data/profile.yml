short_bio: >-
  <p>
    I am a computational and molecular geneticist and an Associate Data Scientist in the
    <a href="https://www.mdanderson.org/research/departments-labs-institutes/departments-divisions/epidemiology.html" target="_blank">Department of Epidemiology</a>
    at the University of Texas MD Anderson Cancer Center, where I work
    with <a href="https://bhattacharya-lab.com" target="_blank">Dr. Arjun Bhattacharya</a> and
    <a href="http://scheet.org" target="_blank">Dr. Paul Scheet</a>. My research asks how early-life environmental
    exposures act through the genome, often through parent-of-origin and imprinting mechanisms, to shape lifelong
    disease risk. I first pursued this in evolutionary genomics, studying intragenomic conflict and
    gene-by-environment effects in social insects during my Ph.D., and I now study it in human placental biology,
    where the same conflict between parental genomes plays out in the tissue that governs fetal development.
  </p>
  <p>
    My current program builds isoform-resolved maps of placental gene regulation and uses them to explain how
    genotype and prenatal exposure jointly program offspring health. Using long-read RNA sequencing, I assembled the
    largest placental transcriptome to date, uncovering 14,985 novel isoforms of known genes that are absent from
    standard adult-tissue annotations. On that foundation I am constructing the first multi-ancestry,
    isoform-resolved placental GxE-xQTL atlas across roughly 2,200 placentas from nine cohorts and five ancestry
    groups, mapping how gestational diabetes, pre-pregnancy obesity, and PFAS exposure modify fetal genetic control
    of isoform expression, splicing, and alternative transcript usage. This spans cis-xQTL mapping within and across
    ancestries, cross-ancestry fine-mapping and colocalization with childhood metabolic GWAS, locus-resolved
    heritability partitioning, and decomposition of genetic signals into direct fetal versus maternal indirect
    polygenic components. I also model parent-of-origin regulation and its disruption by exposure, accounting for
    somatic mosaicism in the placenta.
  </p>
  <p>
    My methods work gives these observational analyses a principled, testable basis for causal claims under unmeasured confounding. 
    I developed <a href="https://github.com/sbresnahan/iconic" target="_blank">ICONIC</a>, an open-source R package that unifies genetic instrumental variables 
    and negative-control calibration in a single proximal causal-inference framework for total-effect and mediation analysis. 
    ICONIC implements eight estimators spanning five confounding-control strategies, screens instrument and negative-control validity, 
    and stress-tests estimator bias across plausible confounding scenarios calibrated to the user's own data by a hybrid GAN-copula generative model, 
    recommending the most robust estimator for the data at hand. Alongside this, I run an independent bioinformatics consulting practice, 
    evaluating therapeutic targets through pan-cancer TCGA and DepMap CRISPR analyses. I am currently seeking tenure-track Assistant Professor positions.
  </p>

