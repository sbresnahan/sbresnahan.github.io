short_bio: >-
  <p>
    I am a computational geneticist studying the evolutionary and developmental origins
    of health and disease. I investigate how parental genomes and prenatal environments
    shape gene regulation and development. My interests span evolutionary biology, molecular
    genetics, and environmental health. The placenta brings these interests together:
    it supports fetal development while mediating interactions between maternal and
    offspring genomes and the prenatal environment. I ask how the evolutionary origins
    of its regulatory systems help explain variation in development and responses to
    conditions during pregnancy.
  </p>
  <p>
    My research combines computational methods and functional genomics to connect genetic
    variation to molecular function across diverse gene-regulatory mechanisms, including
    imprinting, transposon exonization, and splicing.
  </p>
  <p>
    I am an Associate Data Scientist in the
    <a href="https://www.mdanderson.org/research/departments-labs-institutes/departments-divisions/epidemiology.html" target="_blank">Department of Epidemiology</a>
    at the University of Texas MD Anderson Cancer Center, where I work
    with <a href="https://bhattacharya-lab.com" target="_blank">Dr. Arjun Bhattacharya</a> and
    <a href="http://scheet.org" target="_blank">Dr. Paul Scheet</a>.
  </p>
  <p>
    I am currently seeking tenure-track Assistant Professor positions.
  </p>

